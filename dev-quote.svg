<svg
  width="1200"
  height="250"
  viewBox="0 0 1200 250"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Background card -->
  <rect
    x="1"
    y="1"
    width="1198"
    height="248"
    rx="20"
    fill="#191925"
    stroke="#12131b"
    stroke-width="2"
  />

  <!-- Opening quote -->
  <text
    x="40"
    y="72"
    fill="#c792ea"
    font-family="Arial, Helvetica, sans-serif"
    font-size="40"
    font-weight="bold"
  >
    “
  </text>

  <!-- Quote -->
  <text
    fill="#36c2b4"
    font-family="Arial, Helvetica, sans-serif"
    font-size="36"
    font-style="italic"
  >
    <tspan x="72" y="90">
      I'm not a great programmer; I'm just a good programmer
    </tspan>

    <tspan x="72" y="140">
      with great habits.
    </tspan>
  </text>

  <!-- Closing quote -->
  <text
    x="410"
    y="142"
    fill="#c792ea"
    font-family="Arial, Helvetica, sans-serif"
    font-size="40"
    font-weight="bold"
  >
    ”
  </text>

  <!-- Author -->
  <text
    x="1140"
    y="205"
    text-anchor="end"
    fill="#70a5fd"
    font-family="Arial, Helvetica, sans-serif"
    font-size="30"
    font-style="italic"
  >
    — Kent Beck
  </text>
</svg>
